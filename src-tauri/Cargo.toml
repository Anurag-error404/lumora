[package]
name = "photovault-ai"
version = "0.2.1"
description = "Local-first photo & video library manager"
authors = ["you"]
edition = "2021"
# `cargo run` (used by `tauri dev`) should launch the app, not the vault CLI.
default-run = "photovault-ai"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "photovault_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Standalone CLI that opens a vault folder without the app or its database.
[[bin]]
name = "lumora-vault"
path = "src/bin/lumora_vault.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"], package = "tauri" }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.5"
rusqlite = { version = "0.40.1", features = ["bundled"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
sha2 = "0.11.0"
hex = "0.4.3"
walkdir = "2.5.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
kamadak-exif = "0.6.1"
notify = { version = "8.2.0", features = ["macos_fsevent"] }
thiserror = "2.0.19"
anyhow = "1.0.104"
parking_lot = "0.12.5"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
argon2 = "0.5.3"
chacha20poly1305 = "0.11.0"
zeroize = "1.9.0"
getrandom = "0.4.3"
base64 = "0.23.0"
clap = { version = "4.6.4", features = ["derive"] }
rpassword = "7.5.4"
ort = { version = "2.0.0-rc.12", features = ["download-binaries"] }
ureq = "3.3.0"
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"] }
# Offline reverse geocoding for Places. Bundles GeoNames city data (CC-BY 4.0)
# into the binary; no network at build or runtime.
reverse_geocoder = "4.1.1"

[dev-dependencies]
tempfile = "3.27.0"

