# Deploy the static marketing site (index, download, install, guide, plugins,
# SEO pages, blog, roadmap, screenshots, assets) to GitHub Pages.
#
# After merging this workflow, switch the repo to Actions-based Pages:
#   Settings → Pages → Build and deployment → Source: GitHub Actions
# (Legacy “Deploy from branch /” redeploys on every master push — including
# release version bumps — and races/cancels itself.)

name: Deploy Pages

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/pages.yml'
      - '.nojekyll'
      - 'index.html'
      - 'download.html'
      - 'install.html'
      - 'guide.html'
      - 'plugins-guide.html'
      - 'roadmap.html'
      - 'mylio-alternative.html'
      - 'google-photos-alternative.html'
      - 'immich-alternative.html'
      - 'photoprism-alternative.html'
      - 'digikam-alternative.html'
      - 'offline-photo-search.html'
      - 'open-source-photo-organizer.html'
      - 'blog/**'
      - 'docs/screenshots/**'
      - 'styles.css'
      - 'site.js'
      - 'download.js'
      - 'favicon.png'
      - 'Lumora-icon.png'
      - 'lumora-icon-tp.png'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        run: |
          mkdir -p _site/docs _site/blog
          cp \
            index.html \
            download.html \
            install.html \
            guide.html \
            plugins-guide.html \
            roadmap.html \
            mylio-alternative.html \
            google-photos-alternative.html \
            immich-alternative.html \
            photoprism-alternative.html \
            digikam-alternative.html \
            offline-photo-search.html \
            open-source-photo-organizer.html \
            styles.css \
            site.js \
            download.js \
            favicon.png \
            Lumora-icon.png \
            lumora-icon-tp.png \
            .nojekyll \
            _site/
          mkdir -p _site/docs/screenshots
          cp docs/screenshots/*.webp _site/docs/screenshots/
          cp -R blog/. _site/blog/

      - name: Check referenced screenshots exist
        run: |
          missing=0
          for ref in $(grep -rhoE 'docs/screenshots/[A-Za-z0-9_.-]+\.(webp|png|gif)' _site --include='*.html' --include='*.js' | sort -u); do
            [ -f "_site/$ref" ] || { echo "missing asset: $ref"; missing=1; }
          done
          exit $missing

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
