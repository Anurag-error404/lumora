# Builds LUMORA installers and publishes a GitHub Release with auto-generated notes.
# Artifacts: macOS .dmg, Windows .exe/.msi, Linux .AppImage/.deb
#
# Trigger:
#   1. Push a version tag matching package.json / tauri.conf.json, e.g. v0.1.0
#   2. Or run this workflow manually from the Actions tab
#
# Based on: https://v2.tauri.app/distribute/pipelines/github/

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS Apple Silicon
            args: --target aarch64-apple-darwin
          # Intel Mac (x86_64) omitted: ort download-binaries has no
          # x86_64-apple-darwin artifacts (Apple Silicon only).
          - platform: ubuntu-22.04
            label: Linux x64
            args: ''
          - platform: windows-latest
            label: Windows x64
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and upload to GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ad-hoc sign so Apple Silicon Gatekeeper doesn't report the app as "damaged".
          APPLE_SIGNING_IDENTITY: "-"
          # Required for in-app updates (Tauri updater signatures).
          # Repo secret: paste the full private key string from `tauri signer generate`.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: LUMORA v__VERSION__
          releaseBody: |
            ## Install

            Download the installer for your platform from the assets below:

            | Platform | File |
            | --- | --- |
            | macOS (Apple Silicon) | `.dmg` |
            | Windows | `.exe` (NSIS) or `.msi` |
            | Linux | `.AppImage` or `.deb` |

            ### In-app updates

            If you already have LUMORA installed, open **Settings → Updates** and
            click **Check for updates** (or enable automatic checks).

            ### macOS note

            Builds are **ad-hoc signed** (not Apple-notarized). After installing from the `.dmg`:

            1. Open **System Settings → Privacy & Security** and click **Open Anyway** if prompted, **or**
            2. In Terminal:
               ```bash
               xattr -cr /Applications/LUMORA.app
               ```

            macOS Intel is not shipped: the ONNX Runtime build we use has no x86_64-apple-darwin prebuilts.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          tauriScript: bun run tauri
          args: ${{ matrix.args }}
          updaterJsonPreferNsis: true
