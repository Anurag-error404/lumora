# Builds LUMORA installers and publishes a GitHub Release with auto-generated notes.
# Artifacts: macOS .dmg, Windows .exe/.msi, Linux .AppImage/.deb
#
# Triggers:
#   1. Called by Auto Release after a version bump on master
#   2. Push of a version tag matching package.json / tauri.conf.json, e.g. v0.1.0
#   3. Manual run from the Actions tab
#
# Based on: https://v2.tauri.app/distribute/pipelines/github/

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      version:
        description: Version without the leading v (e.g. 0.1.4)
        required: true
        type: string
      previous_tag:
        description: Previous release tag for notes (e.g. v0.1.3); optional
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v (leave empty to use package.json)
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Pre-release tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Frontend tests
        run: bun test

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  prepare:
    name: Resolve version & notes
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        id: meta
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(python3 -c "import json; print(json.load(open('package.json'))['version'])")"
          fi
          echo "version=${VERSION}" >>"$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >>"$GITHUB_OUTPUT"
          echo "Resolved release version: ${VERSION}"

      - name: Generate release notes since last release
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS_TAG_INPUT: ${{ inputs.previous_tag }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          git fetch --tags --force origin

          PREV="${PREVIOUS_TAG_INPUT}"
          if [[ -z "$PREV" ]]; then
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              PREV="$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)"
            else
              PREV="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
            fi
          fi

          if [[ -n "$PREV" && "$PREV" != "$TAG" ]]; then
            BODY="$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f target_commitish="${{ github.sha }}" \
              -f previous_tag_name="$PREV" \
              --jq .body)"
          else
            BODY="$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f target_commitish="${{ github.sha }}" \
              --jq .body)"
          fi

          DELIM="NOTES_EOF_$(python3 -c 'import secrets; print(secrets.token_hex(8))')"
          {
            echo "notes<<${DELIM}"
            echo "## What's changed"
            echo
            echo "$BODY"
            echo
            echo "## Install"
            echo
            echo "Download the installer for your platform from the assets below:"
            echo
            echo "| Platform | File |"
            echo "| --- | --- |"
            echo "| macOS (Apple Silicon) | \`.dmg\` |"
            echo "| Windows | \`.exe\` (NSIS) or \`.msi\` |"
            echo "| Linux | \`.AppImage\` or \`.deb\` |"
            echo
            echo "### In-app updates"
            echo
            echo "If you already have LUMORA installed, open **Settings → Updates** and"
            echo "click **Check for updates** (or enable automatic checks)."
            echo
            echo "### macOS note"
            echo
            echo "Builds are **ad-hoc signed** (not Apple-notarized). After installing from the \`.dmg\`:"
            echo
            echo "1. Open **System Settings → Privacy & Security** and click **Open Anyway** if prompted, **or**"
            echo "2. In Terminal:"
            echo "   \`\`\`bash"
            echo "   xattr -cr /Applications/LUMORA.app"
            echo "   \`\`\`"
            echo
            echo "macOS Intel is not shipped: the ONNX Runtime build we use has no x86_64-apple-darwin prebuilts."
            echo "${DELIM}"
          } >>"$GITHUB_OUTPUT"

  release:
    name: Build (${{ matrix.label }})
    needs: [test, prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS Apple Silicon
            args: --target aarch64-apple-darwin
          # Intel Mac (x86_64) omitted: ort download-binaries has no
          # x86_64-apple-darwin artifacts (Apple Silicon only).
          - platform: ubuntu-22.04
            label: Linux x64
            args: ''
          - platform: windows-latest
            label: Windows x64
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check out release tag
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git fetch --tags --force origin
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            git checkout --force "$TAG"
          else
            echo "Tag $TAG not found locally yet; building current commit ${GITHUB_SHA}"
          fi

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and upload to GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ad-hoc sign so Apple Silicon Gatekeeper doesn't report the app as "damaged".
          APPLE_SIGNING_IDENTITY: "-"
          # Required for in-app updates (Tauri updater signatures).
          # Repo secret: paste the full private key string from `tauri signer generate`.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: LUMORA v${{ needs.prepare.outputs.version }}
          releaseBody: ${{ needs.prepare.outputs.notes }}
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: false
          tauriScript: bun run tauri
          args: ${{ matrix.args }}
          updaterJsonPreferNsis: true
